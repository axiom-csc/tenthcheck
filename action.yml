name: Tenthcheck
description: Check accepted invariants (tenthcheck.toml) on a pull request, report counterexamples and blast radius.
inputs:
  base:
    description: Base ref to diff against for changed-symbol / blast-radius reporting.
    default: origin/${{ github.base_ref }}
  comment:
    description: Post (or update) a summary comment on the pull request.
    default: "true"
  receipt:
    description: Write a signed receipt to this path (needs the TENTHCHECK_SIGNING_KEY env var). Empty = none.
    default: ""
  python-version:
    description: Python version used to run tenthcheck.
    default: "3.11"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install tenthlook (the tenthcheck command) from this action's checkout
      shell: bash
      run: |
        pip install "${{ github.action_path }}"
        # Signed receipts are part of the package now (tenthlook.core): nothing extra to install.
        if [ -n "${{ inputs.receipt }}" ]; then echo "TENTHCHECK_RECEIPTS=1" >> "$GITHUB_ENV"; fi
    - name: Run tenthcheck ci
      id: tc
      shell: bash
      run: |
        set +e
        args=(ci . --summary-file "$RUNNER_TEMP/tenthcheck-summary.md")
        [ -n "${{ inputs.base }}" ] && [ "${{ github.event_name }}" = "pull_request" ] && args+=(--base "${{ inputs.base }}")
        [ -n "${{ inputs.receipt }}" ] && [ "$TENTHCHECK_RECEIPTS" = "1" ] && args+=(--receipt "${{ inputs.receipt }}")
        tenthcheck "${args[@]}" > /dev/null
        code=$?
        cat "$RUNNER_TEMP/tenthcheck-summary.md" >> "$GITHUB_STEP_SUMMARY"
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(process.env.RUNNER_TEMP + '/tenthcheck-summary.md', 'utf8');
          const {owner, repo} = context.repo;
          const issue_number = context.issue.number;
          const marker = '<!-- tenthcheck-summary -->';
          const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
          const prev = comments.find(c => c.body && c.body.startsWith(marker));
          if (prev) await github.rest.issues.updateComment({owner, repo, comment_id: prev.id, body});
          else await github.rest.issues.createComment({owner, repo, issue_number, body});
    - name: Fail if an accepted invariant is violated
      shell: bash
      run: exit ${{ steps.tc.outputs.exit_code }}
