[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenthcheck"
version = "1.0.0.dev0"
description = "Tenthcheck, from Tenthlook: see what an AI coding agent's edit could break before it lands. Static checks for Python: dependents by hop, import cycles, edit impact. CLI and MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["sqlglot>=25", "z3-solver>=4.12", "tomli>=2; python_version<'3.11'"]

[project.urls]
Homepage = "https://tenthlook.com"
Repository = "https://github.com/tenthlook/tenthcheck"
Issues = "https://github.com/tenthlook/tenthcheck/issues"

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
receipt = ["cryptography>=42"]

[project.scripts]
tenthcheck = "tenthcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
