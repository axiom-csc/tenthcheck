# Copy to .github/workflows/tenthcheck.yml in your repository.
name: tenthcheck
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write      # to post the summary comment (fork PRs get a read-only token: set comment: "false")
jobs:
  tenthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # needed to diff against the base branch
      - uses: tenthlook/tenthcheck@v1   # replace with wherever you host this action
        with:
          receipt: tenthcheck-receipt.json     # optional; needs the secret below
        env:
          TENTHCHECK_SIGNING_KEY: ${{ secrets.TENTHCHECK_SIGNING_KEY }}   # optional, from `tenthcheck keygen`
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenthcheck-receipt
          path: tenthcheck-receipt.json
          if-no-files-found: ignore
